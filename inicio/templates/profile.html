{% load static %}
{% include 'header.html' %}

<div class="clearfix"></div>
<div class="content-wrapper">
  <div class="container-fluid">
    <div class="card mt-3">
      <div class="card-header">
        <h4>Perfil de Usuario</h4>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-4 text-center">
            <img src="{% static 'private/images/avatars/avatar-1.png' %}" class="rounded-circle" style="width: 150px; height: 150px;" alt="Avatar">
            <h4 class="mt-3">Usuario Ejemplo</h4>
            <p class="text-muted">usuario@example.com</p>
          </div>
          <div class="col-md-8">
            <h5>Información Personal</h5>
            <div class="form-group">
              <label>Nombre Completo</label>
              <input type="text" class="form-control" value="Usuario Ejemplo" disabled>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" class="form-control" value="usuario@example.com" disabled>
            </div>
            <div class="form-group">
              <label>Teléfono</label>
              <input type="text" class="form-control" value="+34 123 456 789" disabled>
            </div>
            <button class="btn btn-primary">Editar Perfil</button>
            <button class="btn btn-secondary">Cambiar Contraseña</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% include 'footer.html' %}
