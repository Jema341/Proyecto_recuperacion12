{% load static %}
{% include 'header.html' %}

<div class="clearfix"></div>
<div class="content-wrapper">
  <div class="container-fluid">
    <div class="card mt-3">
      <div class="card-header">
        <h4>PERFIL DE USUARIO</h4>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-4 text-center">
            {% if user_profile.avatar %}
              <img src="{{ user_profile.avatar.url }}" class="rounded-circle" style="width: 150px; height: 150px; object-fit: cover;" alt="Avatar">
            {% else %}
              <img src="{% static 'private/images/avatars/avatar-1.png' %}" class="rounded-circle" style="width: 150px; height: 150px;" alt="Avatar">
            {% endif %}
            <h4 class="mt-3">{{ user_profile.full_name }}</h4>
            <p class="text-muted">{{ user_profile.user.email }}</p>
          </div>
          <div class="col-md-8">
            <h5>INFORMACION PERSONAL</h5>
            <div class="form-group">
              <label>NOMBRE COMPLETO</label>
              <input type="text" class="form-control" value="{{ user_profile.full_name }}" disabled>
            </div>
            <div class="form-group">
              <label>EMAIL</label>
              <input type="email" class="form-control" value="{{ user_profile.user.email }}" disabled>
            </div>
            <div class="form-group">
              <label>Teléfono</label>
              <input type="text" class="form-control" value="{{ user_profile.phone|default:'-' }}" disabled>
            </div>
            <div class="form-group">
              <label>Dirección</label>
              <input type="text" class="form-control" value="{{ user_profile.direccion|default:'-' }}" disabled>
            </div>
            <button class="btn btn-primary">Editar Perfil</button>
            <button class="btn btn-secondary">CAMBIAR CONTRASEÑA</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% include 'footer.html' %}
