{% load static %}
{% include 'header.html' %}

<div class="clearfix"></div>
  <div class="content-wrapper">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <h4 class="mb-4">Editar Cliente</h4>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h6 class="card-title">Formulario de Edición</h6>
        </div>
        <div class="card-body">
          <form method="POST">
            {% csrf_token %}
            
            <div class="form-group mb-3">
              <label for="nombre">Nombre *</label>
              <input type="text" class="form-control" id="nombre" name="nombre" value="{{ cliente.nombre }}" required>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="email">Email *</label>
                  <input type="email" class="form-control" id="email" name="email" value="{{ cliente.email }}" required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="telefono">Teléfono</label>
                  <input type="text" class="form-control" id="telefono" name="telefono" value="{{ cliente.telefono }}">
                </div>
              </div>
            </div>

            <div class="form-group mb-3">
              <label for="direccion">Dirección</label>
              <textarea class="form-control" id="direccion" name="direccion" rows="3">{{ cliente.direccion }}</textarea>
            </div>

            <div class="form-group mb-3">
              <label for="ciudad">Ciudad</label>
              <input type="text" class="form-control" id="ciudad" name="ciudad" value="{{ cliente.ciudad }}">
            </div>

            <div class="form-group">
              <button type="submit" class="btn btn-success">Guardar Cambios</button>
              <a href="{% url 'clientes' %}" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

{% include 'footer.html' %}
