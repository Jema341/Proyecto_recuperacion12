{% load static %}
{% include 'header.html' %}

<div class="clearfix"></div>
  <div class="content-wrapper">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <h4 class="mb-4">Editar Producto</h4>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h6 class="card-title">Formulario de Edición</h6>
        </div>
        <div class="card-body">
          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group mb-3">
              <label for="nombre">Nombre *</label>
              <input type="text" class="form-control" id="nombre" name="nombre" value="{{ producto.nombre }}" required>
            </div>

            <div class="form-group mb-3">
              <label for="descripcion">Descripción</label>
              <textarea class="form-control" id="descripcion" name="descripcion" rows="4">{{ producto.descripcion }}</textarea>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="precio">Precio *</label>
                  <input type="number" class="form-control" id="precio" name="precio" step="0.01" value="{{ producto.precio }}" required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="stock">Stock *</label>
                  <input type="number" class="form-control" id="stock" name="stock" value="{{ producto.stock }}" required>
                </div>
              </div>
            </div>

            <div class="form-group mb-3">
              <label for="categoria">Categoría</label>
              <input type="text" class="form-control" id="categoria" name="categoria" value="{{ producto.categoria }}">
            </div>

            <div class="form-group mb-3">
              <label for="imagen">Imagen del Producto</label>
              {% if producto.imagen %}
                <div class="mb-2">
                  <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}" style="max-width: 200px; border-radius: 4px;">
                </div>
              {% endif %}
              <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
              <small class="form-text text-muted">Formatos soportados: JPG, PNG, GIF. Tamaño máximo: 5MB</small>
            </div>

            <div class="form-group">
              <button type="submit" class="btn btn-success">Guardar Cambios</button>
              <a href="{% url 'productos' %}" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

{% include 'footer.html' %}
